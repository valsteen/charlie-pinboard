[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "codex-repo-work"
version = "0.1.0"
description = "Validated coordination for one repository-owned work ledger"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.scripts]
repo-work = "repo_work.cli:main"

[tool.uv.build-backend]
module-name = "repo_work"

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ANN", "B", "C4", "E4", "E7", "E9", "F", "I", "PIE", "PTH", "RET", "RUF", "SIM", "UP", "W"]

[tool.ruff.lint.isort]
known-first-party = ["repo_work", "tests"]

[tool.pyrefly]
python-version = "3.14"
project-includes = ["src", "tests"]
search-path = ["."]
preset = "strict"
min-severity = "warn"

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
    "ruff>=0.16.3",
]
