[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "charlie-board"
version = "0.1.0"
description = "Validated coordination for one repository-owned work ledger"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "msgspec>=0.21.1",
]

[project.scripts]
charlie = "repo_work.cli:main"
repo-work = "repo_work.cli:main"

[tool.uv.build-backend]
module-name = "repo_work"

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ANN", "ARG", "B", "BLE", "C4", "C90", "E4", "E7", "E9", "F", "I", "PERF", "PGH", "PIE", "PLC0415", "PLR0912", "PLR0915", "PTH", "RET", "RUF", "SIM", "T10", "TID", "UP", "W"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"enum.StrEnum".msg = "Use Enum so string behavior remains explicit."
"typing.Any".msg = "Use a concrete type or a closed union."

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.isort]
known-first-party = ["repo_work", "tests"]

[tool.pyrefly]
python-version = "3.14"
project-includes = ["src", "tests"]
search-path = ["."]
preset = "strict"
min-severity = "warn"

[[tool.pyrefly.sub-config]]
matches = "src/**"

[tool.pyrefly.sub-config.errors]
unknown-argument-type = "warn"
unknown-attribute-type = "warn"
unknown-variable-type = "warn"

[tool.coverage.run]
branch = true
source = ["repo_work"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[dependency-groups]
dev = [
    "coverage>=7.10.4",
    "hypothesis>=6.138.7",
    "pyyaml>=6.0.3",
    "pyrefly>=1.2.0",
    "ruff>=0.16.3",
]
