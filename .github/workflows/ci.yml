name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14.6"
          enable-cache: true
      - name: Sync locked development environment
        run: uv sync --locked
      - name: Check generated visitor guide
        run: uv run --locked python -m docs.how_it_works.render --check
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Lint
        run: uv run --locked ruff check .
      - name: Type-check
        run: uv run --locked pyrefly check
      - name: Check strict type coverage
        run: uv run --locked pyrefly coverage check src --strict --fail-under 100
      - name: Test with branch coverage
        run: |
          uv run --locked coverage run -m unittest discover -v
          uv run --locked coverage report
      - name: Validate plugin and skill metadata
        run: uv run --locked python scripts/validate-metadata.py
      - name: Build without workspace sources
        run: uv build --no-sources
      - name: Smoke-test the isolated wheel
        run: |
          uv run --isolated --no-project --with ./dist/*.whl pinboard --version
          uv run --isolated --no-project --with ./dist/*.whl pinboard --help
          smoke_repository=$(mktemp -d)
          git -C "$smoke_repository" init
          uv run --isolated --no-project --with ./dist/*.whl pinboard --project-root "$smoke_repository" init
          test -f "$smoke_repository/.codex/pinboard/state.sqlite3"
          git -C "$smoke_repository" check-ignore -q .codex/pinboard/state.sqlite3
