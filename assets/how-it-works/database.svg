ill="#394a62"/><text x="906" y="678" class="box-title">Committed history</text><text x="906" y="699" class="box-body">input + outcome + actor</text><text x="906" y="726" class="box-meta">transition_history</text><text x="28" y="790" text-anchor="start" font-size="11" class="note-meta">SELECTED RELATIONSHIPS SHOWN · EVERY FOREIGN KEY STILL CHECKED BY THE SEED</text><text x="28" y="816" text-anchor="start" font-size="11" class="note">Briefs are selected by attempts. Ready-review evidence links to the item. Shared authority is temporary, not a coordinator task.</text>
