  <title id="title">Six kinds of memory in one relational ledger</title>
  <desc id="description">Sixteen SQLite tables preserve work identity, scope, proposals, artifacts, authority, and history. Relationship families are grouped for readability while the source seed accounts for every foreign key.</desc>
