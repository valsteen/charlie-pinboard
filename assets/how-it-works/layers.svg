  <text x="28" y="38" class="section-label">OUTSIDE THE PACKAGE</text><text x="28" y="60" class="section-subtitle">callers and durable systems</text><text x="28" y="150" class="section-label">INSIDE THE PACKAGE</text><text x="28" y="172" class="section-subtitle">each layer removes a different ambiguity</text><line x1="176" y1="34" x2="1172" y2="34" class="guide"/><line x1="170" y1="146" x2="1172" y2="146" class="guide"/><line x1="180" y1="310" x2="1172" y2="310" class="guide"/><line x1="180" y1="470" x2="1172" y2="470" class="guide"/><path d="M580 118L580 174" class="connector" marker-end="url(#arrow)"/><text x="618" y="151" text-anchor="middle" class="connector-label">DECODE</text><path d="M600 286L600 334" class="connector" marker-end="url(#arrow)"/><text x="666" y="316" text-anchor="middle" class="connector-label">EXACT COMMAND</text><path d="M600 446L600 494" class="connector" marker-end="url(#arrow)"/><text x="664" y="476" text-anchor="middle" class="connector-label">DECISION FACTS</text><path d="M870 390L998 390Q1010 390 1010 402L1010 494" class="connector" stroke-dasharray="7 7"/><text x="944" y="378" text-anchor="middle" class="connector-label">PORTS</text><path d="M900 550L870 550" class="connector" marker-end="url(#arrow)"/><path d="M1070 606L1070 674" class="connector" marker-end="url(#arrow)"/><text x="1124" y="646" text-anchor="middle" class="connector-label">COMMIT / RELOAD</text><rect x="430" y="46" width="300" height="72" class="box"/><rect x="430" y="46" width="3" height="72" fill="#81796f"/><text x="446" y="68" class="box-label">INPUTS</text><text x="446" y="95" class="box-title">CLI · JSON · project files</text><rect x="330" y="174" width="540" height="112" class="box"/><rect x="330" y="174" width="3" height="112" fill="#394a62"/><text x="346" y="196" class="box-label">INTERFACES</text><text x="346" y="223" class="box-title">Make the request exact</text><text x="346" y="244" class="box-body">decode one command · present one result</text><text x="3