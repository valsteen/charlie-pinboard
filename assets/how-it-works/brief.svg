0" class="box-body">outcome + provenance</text><text x="66" y="561" class="box-body">scope + non-goals</text><text x="66" y="576" class="box-meta">interpreted semantics</text><text x="406" y="492" class="box-label">OBLIGATIONS + PROOF</text><text x="406" y="519" class="box-title">Say what earns acceptance</text><text x="406" y="540" class="box-body">contracts + criteria</text><text x="406" y="561" class="box-body">sources + tests + verification</text><text x="406" y="576" class="box-meta">interpreted semantics</text><text x="236" y="682" class="box-label">HONEST REMAINDER</text><text x="236" y="709" class="box-title">Say what is still undone</text><text x="236" y="730" class="box-body">remaining work + deferrals</text><text x="236" y="761" class="box-meta">interpreted semantics</text><text x="726" y="492" class="box-label">EXACT SHAPE</text><text x="726" y="519" class="box-title">Reject malformed briefs</text><text x="726" y="540" class="box-body">required fields present</text><text x="726" y="561" class="box-body">unknown fields rejected</text><text x="726" y="576" class="box-meta">typed decode</text><text x="1066" y="492" class="box-label">COHERENT REFERENCES</text><text x="1066" y="519" class="box-title">Reject mismatched links</text><text x="1066" y="540" class="box-body">scope + authority identities</text><text x="1066" y="561" class="box-body">coverage owners + unique IDs</text><text x="1066" y="576" class="box-meta">cross-field checks</text><text x="896" y="682" class="box-label">STABLE IDENTITY</text><text x="896" y="709" class="box-title">Bind the exact artifact</text><text x="896" y="730" class="box-body">canonical bytes + SHA-256</text><text x="896" y="751" class="box-body">immutable publication</text><text x="896" y="766" class="box-meta">byte identity</text><text x="700" y="825" text-anchor="middle" font-size="11" class="note-meta canvas-text">IMPLEMENTATION · REVIEW · RESUME RECEIVE THE SAME DISTINCTIONS — CODE PROVES THE ENVELOPE, NOT THE MEANING</tex