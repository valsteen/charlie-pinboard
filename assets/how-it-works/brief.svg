  <title id="title">One strict brief works as a reasoning scaffold and a validated envelope</title>
  <desc id="description">The same canonical work brief is interpreted by a human and an LLM through explicit semantic sections, while Pinboard code checks only its shape, internal references, and immutable identity. Implementation, review, and resume receive those same distinctions; code does not decide whether the prose is true.</desc>
